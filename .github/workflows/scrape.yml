name: Scrape NYPD CompStat

on:
  # NYPD publishes weekly CompStat data Monday–Tuesday after the reporting week ends Sunday.
  # Check early and often on Monday (when data usually lands), then taper through Wednesday.
  # No-op runs that find no new week just exit without committing, so extra checks are free.
  # Times below are ET during EDT (UTC-4); they shift one hour earlier during EST.
  #   Monday   9 AM, 12 PM, 3 PM, 6 PM ET — catch the Monday publication ASAP
  #   Tuesday  9 AM, 3 PM ET            — backup if NYPD publishes late Monday/Tuesday
  #   Wednesday 12 PM ET                — final safety net
  schedule:
    - cron: '0 13 * * 1'
    - cron: '0 16 * * 1'
    - cron: '0 19 * * 1'
    - cron: '0 22 * * 1'
    - cron: '0 13 * * 2'
    - cron: '0 19 * * 2'
    - cron: '0 16 * * 3'
  
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests openpyxl

      - name: Run scraper
        run: python scraper.py --boroughs --housing --format both --output ./data

      - name: Validate output
        run: python validate.py --file ./data/latest_compstat.json

      - name: Commit and push results
        run: |
          git config user.name "CompStat Bot"
          git config user.email "compstat-bot@users.noreply.github.com"
          git add data/
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            WEEK=$(python -c "import json; d=json.load(open('data/latest_compstat.json')); print(d.get('citywide',{}).get('report_period',{}).get('week_end','unknown'))")
            git commit -m "Update CompStat data: week ending ${WEEK}"
            git pull --rebase
            git push
          fi
